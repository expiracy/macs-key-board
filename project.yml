# XcodeGen manifest for the signed MacsKeyBored.app. Regenerate the (git-ignored) .xcodeproj with:
#   xcodegen generate
# The app reuses the package's MacsKeyBoredKit library, so `swift run macskeybored` and the .app share every line.
name: MacsKeyBored
options:
  bundleIdPrefix: com.jgray
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MacsKeyBored:
    path: .

targets:
  MacsKeyBored:
    type: application
    platform: macOS
    sources:
      - path: App
        # Xcode builds the icon from AppIcon.icon; the .icns is for the SwiftPM-built bundle.
        excludes: ["AppIcon.icns", "AppIcon.icon"]
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MacsKeyBored
        product: MacsKeyBoredKit
    settings:
      base:
        PRODUCT_NAME: MacsKeyBored
        PRODUCT_BUNDLE_IDENTIFIER: com.jgray.macskeybored
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES            # menu-bar only, no Dock icon
        INFOPLIST_KEY_CFBundleDisplayName: "MacsKeyBored"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  MacsKeyBored:
    build:
      targets:
        MacsKeyBored: all
    run:
      config: Debug
