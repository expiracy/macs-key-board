# XcodeGen manifest for the signed MacsBored.app. Regenerate the (git-ignored) .xcodeproj with:
#   xcodegen generate
# The app reuses the package's MacsBoredKit library, so `swift run macsbored` and the .app share every line.
name: MacsBored
options:
  bundleIdPrefix: com.jgray
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MacsBored:
    path: .

targets:
  MacsBored:
    type: application
    platform: macOS
    sources:
      - path: App
        # Xcode builds the icon from AppIcon.icon; the .icns is for the SwiftPM-built bundle.
        excludes: ["AppIcon.icns", "AppIcon.icon"]
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MacsBored
        product: MacsBoredKit
    settings:
      base:
        PRODUCT_NAME: MacsBored
        PRODUCT_BUNDLE_IDENTIFIER: com.jgray.macsbored
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES            # menu-bar only, no Dock icon
        INFOPLIST_KEY_CFBundleDisplayName: "MacsBored"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  MacsBored:
    build:
      targets:
        MacsBored: all
    run:
      config: Debug
